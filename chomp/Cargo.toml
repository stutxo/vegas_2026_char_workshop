[package]
name = "chomp"
version = "0.1.0"
edition = "2024"
autoexamples = false
license = "MIT"

[dependencies]
sha2 = "0.10.8"
secp256k1 = { version ="0.31.0", features = ["rand", "hashes"] }
bitcoin = "0.32.5"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.13"
anyhow = "1.0"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
hex = "0.4.3"
bitcoind-async-client = { version = "0.10.0", features = ["raw_rpc"] }
reqwest = "0.13.2"
async-trait = "0.1.89"
thiserror = "2.0.18"
elements = "0.26.1"
rayon = "1.11.0"
borsh = { version = "1.6.0", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "txid_grind_bench"
harness = false

[[example]]
name = "bitcoin"
path = "examples/bitcoin/main.rs"

[[example]]
name = "council"
path = "examples/council/main.rs"

[[example]]
name = "liquid"
path = "examples/liquid/main.rs"

[[example]]
name = "mock_council_server"
path = "examples/mock_council_server/main.rs"

[[example]]
name = "multi"
path = "examples/multi/main.rs"
